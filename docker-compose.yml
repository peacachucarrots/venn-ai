services:
  db:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    working_dir: /app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TYPEFORM_TOKEN=${TYPEFORM_TOKEN}
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app:cached

  frontend:
    build: ./frontend
    working_dir: /app
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  pgdata:
